[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "k3lab"
version = "0.6.0"
description = "A source-grounded Kimi K3 study and executable lab for foundation-model mechanisms and agentic post-training."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.40.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "numpy>=1.26",
]
mechanisms = ["numpy>=1.26"]
train = [
  "datasets>=4.0.0",
  "transformers>=5.2.0",
  "trl>=1.13.0",
  "peft>=0.17.0",
  "accelerate>=1.10.0",
]

[project.scripts]
k3lab-eval = "k3lab.eval:main"
k3lab-replay = "k3lab.replay:main"
k3lab-summarize = "k3lab.summary:main"
k3lab-export-sft = "k3lab.export_sft:main"
k3lab-train-sft = "k3lab.train.sft:main"
k3lab-train-grpo = "k3lab.train.grpo:main"
k3lab-autoresearch = "k3lab.autoresearch:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

